name: collect_attendance
description: Smart Attendance System — IoT Bridge connecting Arduino BLE RFID scanner to Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # BLE Connectivity
  flutter_blue_plus: ^2.3.5

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # Local Database
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # Connectivity Monitoring
  connectivity_plus: ^7.1.1

  # Backend
  supabase_flutter: ^2.12.4

  # Permissions
  permission_handler: ^12.0.2

  # Utilities
  uuid: ^4.5.1
  get_it: ^9.2.1
  google_fonts: ^8.1.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.7.0
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon_foreground.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  monochrome_icon: "assets/icon_monochrome.png"
  min_sdk_android: 21
